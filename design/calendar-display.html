<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EPD 7.5″ — Calendar Display Mockup</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');

    :root {
      --epd-paper: #f4f1ea;
      --epd-black: #1a1a18;
      --epd-red: #c41e3a;
      --epd-red-soft: #d94a5c;
    }

    body {
      background: linear-gradient(145deg, #2a2826 0%, #1c1b19 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: "Noto Serif SC", "Songti SC", serif;
    }

    .preview-shell {
      width: 100%;
      max-width: min(100vw - 2rem, 960px);
      aspect-ratio: 640 / 384;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .epd-canvas {
      width: 640px;
      height: 384px;
      transform-origin: center center;
      transform: scale(min(1, calc((100vw - 2rem) / 640), calc((100vh - 3rem) / 384)));
      background: var(--epd-paper);
      box-shadow:
        0 0 0 2px #3d3a35,
        0 12px 40px rgba(0, 0, 0, 0.45),
        inset 0 0 80px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--epd-black);
    }

    .top-row {
      height: 307px;
      display: flex;
      flex-shrink: 0;
    }

    .calendar-panel {
      width: 384px;
      height: 307px;
      padding: 10px 12px 8px;
      border-right: 1px solid rgba(26, 26, 24, 0.12);
      display: flex;
      flex-direction: column;
    }

    .cal-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      margin-bottom: 6px;
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    .cal-header .year { text-align: left; font-weight: 600; }
    .cal-header .month { text-align: center; font-size: 18px; font-weight: 700; }
    .cal-header .weekday-label { text-align: right; font-size: 11px; opacity: 0.75; }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 0;
      border-bottom: 1.5px solid var(--epd-black);
      margin-bottom: 4px;
    }

    .weekdays span:first-child { color: var(--epd-red); }

    .days-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 2px;
      font-size: 15px;
      font-weight: 500;
    }

    .day-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
    }

    .day-cell.other-month { opacity: 0.28; font-size: 13px; }
    .day-cell.sunday { color: var(--epd-red); }
    .day-cell.today {
      background: var(--epd-red);
      color: var(--epd-paper);
      font-weight: 700;
      box-shadow: inset 0 0 0 1px #8b1529;
    }

    .art-panel {
      width: 256px;
      height: 307px;
      position: relative;
      overflow: hidden;
      background: var(--epd-paper);
    }

    .art-panel svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .bottom-strip {
      height: 77px;
      width: 640px;
      flex-shrink: 0;
      border-top: 2px solid var(--epd-black);
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #ebe6dc 0%, var(--epd-paper) 40%, #e8e3d8 100%);
    }

    .clock-display {
      font-family: "Playfair Display", "Noto Serif SC", serif;
      font-size: 42px;
      font-weight: 600;
      font-style: italic;
      letter-spacing: 0.06em;
      background: linear-gradient(180deg, #2a2926 0%, #0d0d0c 55%, #1f1e1c 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.35))
              drop-shadow(0 2px 1px rgba(0, 0, 0, 0.25));
      position: relative;
    }

    .clock-display .tz {
      font-size: 0.42em;
      font-style: normal;
      letter-spacing: 0.04em;
      vertical-align: middle;
      margin-left: 0.15em;
      background: linear-gradient(180deg, var(--epd-red-soft) 0%, var(--epd-red) 100%);
      -webkit-background-clip: text;
      background-clip: text;
    }
  </style>
</head>
<body>
  <div class="preview-shell">
    <div class="epd-canvas" role="img" aria-label="640 by 384 e-paper calendar mockup">
      <div class="top-row">
        <section class="calendar-panel">
          <header class="cal-header">
            <span class="year">2026 年</span>
            <span class="month">三月</span>
            <span class="weekday-label">星期</span>
          </header>
          <div class="weekdays">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
          </div>
          <div class="days-grid">
            <div class="day-cell sunday">1</div><div class="day-cell">2</div><div class="day-cell">3</div><div class="day-cell">4</div><div class="day-cell">5</div><div class="day-cell">6</div><div class="day-cell">7</div>
            <div class="day-cell sunday">8</div><div class="day-cell">9</div><div class="day-cell">10</div><div class="day-cell">11</div><div class="day-cell">12</div><div class="day-cell">13</div><div class="day-cell">14</div>
            <div class="day-cell sunday">15</div><div class="day-cell">16</div><div class="day-cell">17</div><div class="day-cell today">18</div><div class="day-cell">19</div><div class="day-cell">20</div><div class="day-cell">21</div>
            <div class="day-cell sunday">22</div><div class="day-cell">23</div><div class="day-cell">24</div><div class="day-cell">25</div><div class="day-cell">26</div><div class="day-cell">27</div><div class="day-cell">28</div>
            <div class="day-cell sunday">29</div><div class="day-cell">30</div><div class="day-cell">31</div>
            <div class="day-cell other-month">1</div><div class="day-cell other-month">2</div><div class="day-cell other-month">3</div><div class="day-cell other-month">4</div><div class="day-cell other-month">5</div><div class="day-cell other-month">6</div><div class="day-cell other-month sunday">7</div>
            <div class="day-cell other-month">8</div><div class="day-cell other-month">9</div><div class="day-cell other-month">10</div><div class="day-cell other-month">11</div>
          </div>
        </section>

        <aside class="art-panel" aria-hidden="true">
          <svg viewBox="0 0 256 307" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="gBlack" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#1a1a18"/>
                <stop offset="100%" stop-color="#3d3d38"/>
              </linearGradient>
              <linearGradient id="gRed" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#8b1529"/>
                <stop offset="50%" stop-color="#c41e3a"/>
                <stop offset="100%" stop-color="#e85a6b"/>
              </linearGradient>
              <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
                <line x1="0" y1="0" x2="0" y2="8" stroke="#1a1a18" stroke-width="1.2" opacity="0.35"/>
              </pattern>
            </defs>
            <rect width="256" height="307" fill="#f4f1ea"/>
            <circle cx="200" cy="52" r="38" fill="url(#gRed)" opacity="0.92"/>
            <path d="M0 120 Q128 80 256 130 L256 307 L0 307 Z" fill="url(#gBlack)" opacity="0.88"/>
            <rect x="18" y="140" width="90" height="120" fill="#f4f1ea" stroke="#1a1a18" stroke-width="3"/>
            <rect x="24" y="146" width="78" height="108" fill="url(#hatch)"/>
            <path d="M130 180 L220 95 L240 115 L150 200 Z" fill="url(#gRed)"/>
            <circle cx="72" cy="248" r="22" fill="none" stroke="#c41e3a" stroke-width="4"/>
            <line x1="40" y1="270" x2="216" y2="40" stroke="#1a1a18" stroke-width="2" opacity="0.2"/>
            <text x="128" y="292" text-anchor="middle" font-family="serif" font-size="11" fill="#c41e3a" opacity="0.7">B · W · R</text>
          </svg>
        </aside>
      </div>

      <footer class="bottom-strip">
        <div class="clock-display">
          14:32<span class="tz">（UTC+8）</span>
        </div>
      </footer>
    </div>
  </div>
</body>
</html>
